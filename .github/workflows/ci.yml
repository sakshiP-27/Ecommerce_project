name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest httpx

      - name: Lint with flake8
        # Style check on app code (training scripts under src/models are excluded)
        run: >
          flake8 src/api src/dashboard src/data src/features src/config src/utils
          --max-line-length=100
          --extend-ignore=E203,W503,E402

      - name: Run pytest
        run: pytest tests/ -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API and dashboard images
        run: docker compose build

data_path: "dataset/ecommerce_sessions.csv"
model_path: "models/"
random_seed: 42
test_size: 0.2
target_column: "Converted"
categorical_columns:
  - "OperatingSystems"
  - "Browser"
  - "Region"
  - "TrafficType"
  - "VisitorType"
  - "Month"
  - "Weekend"
threshold: 0.5
# Stretch goal #1 — simple business costs for profit-curve thresholding
# intervention_cost: cost of acting on a flagged session (e.g. discount / outreach)
# conversion_value: value of correctly catching one purchase
intervention_cost: 5
conversion_value: 50
